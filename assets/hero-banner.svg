  </text>

  <!-- Core Specialty Badges -->
  <g transform="translate(56, 276)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
    <rect x="0" y="0" width="168" height="34" rx="6" fill="#0b1322" stroke="#1e3a5f" />
    <text x="14" y="21" fill="#38bdf8">◆ AI Agents &amp; Local LLMs</text>

    <rect x="180" y="0" width="176" height="34" rx="6" fill="#0b1322" stroke="#1e3a5f" />
    <text x="194" y="21" fill="#38bdf8">◆ Defensive Cybersecurity</text>

    <rect x="368" y="0" width="174" height="34" rx="6" fill="#0b1322" stroke="#1e3a5f" />
    <text x="382" y="21" fill="#38bdf8">◆ Full-Stack &amp; Mobile</text>

    <rect x="554" y="0" width="174" height="34" rx="6" fill="#0b1322" stroke="#1e3a5f" />
    <text x="568" y="21" fill="#f59e0b">◆ Fintech &amp; Marketplaces</text>

    <rect x="740" y="0" width="166" height="34" rx="6" fill="#0b1322" stroke="#1e3a5f" />
    <text x="754" y="21" fill="#60a5fa">◆ Cloud &amp; Observability</text>
  </g>
