<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Akandwanaho Ivan Alvin — Software Engineer, AI Systems Builder, Cybersecurity &amp; Full-Stack Engineering</title>
  <desc id="heroDesc">Executive engineering banner for Akandwanaho Ivan Alvin, Founder and Managing Director of Codesphere Innovations (U) Limited in Kampala, Uganda.</desc>
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b14" />
      <stop offset="55%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#0f1d35" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="subtleGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1e293b" stroke-width="0.6" opacity="0.45" />
    </pattern>
  </defs>

  <!-- Background & Frame -->
  <rect width="1200" height="360" rx="16" fill="url(#navyBg)" />
  <rect width="1200" height="360" rx="16" fill="url(#subtleGrid)" />
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#1e3a5f" stroke-width="1.5" />

  <!-- Subtle Right Architectural Geometry -->
  <g transform="translate(880, 48)" opacity="0.85">
    <circle cx="130" cy="130" r="118" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="130" cy="130" r="84" fill="#091324" stroke="#2563eb" stroke-width="1.2" opacity="0.8" />
    <polygon points="130,58 192,94 192,166 130,202 68,166 68,94" fill="#0d1b33" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="130" cy="58" r="4" fill="#f59e0b" />
    <circle cx="192" cy="94" r="3.5" fill="#38bdf8" />
    <circle cx="192" cy="166" r="3.5" fill="#38bdf8" />
    <circle cx="130" cy="202" r="4" fill="#f59e0b" />
    <circle cx="68" cy="166" r="3.5" fill="#38bdf8" />
    <circle cx="68" cy="94" r="3.5" fill="#38bdf8" />
    <text x="130" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="2">SYSTEMS</text>
    <text x="130" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="600" fill="#f59e0b" letter-spacing="1.5">ARCHITECTURE</text>
  </g>

  <!-- Location & Leadership Badge -->
  <rect x="56" y="38" width="520" height="30" rx="6" fill="#0f1b2d" stroke="#2563eb" stroke-width="1" />
  <circle cx="74" cy="53" r="4.5" fill="#f59e0b" />
  <text x="90" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#e2e8f0" letter-spacing="1.2">
    KAMPALA, UGANDA · FOUNDER &amp; MD, CODESPHERE INNOVATIONS (U) LTD
  </text>

  <!-- Name -->
  <text x="56" y="122" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    Akandwanaho Ivan Alvin
  </text>

  <!-- Core Positioning -->
  <text x="56" y="164" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="url(#blueAccent)">
    Software Engineer · AI Systems Builder · Cybersecurity · Full-Stack &amp; Cloud Engineering
  </text>

  <!-- Gold Accent Divider -->
  <rect x="56" y="184" width="680" height="2" fill="url(#goldLine)" />

  <!-- Mission Statement -->
  <text x="56" y="218" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1">
