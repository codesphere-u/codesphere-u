  <text x="65" y="267" fill="#dde9f5" font-weight="650" font-size="17.5" letter-spacing="1.4" class="appear delay3">SOFTWARE ENGINEER  /  AI SYSTEMS BUILDER</text>
  <text x="65" y="296" fill="#86a8c6" font-size="14" letter-spacing="1.5" class="appear delay3">CYBERSECURITY  ·  CLOUD  ·  FULL-STACK</text>
  <path d="M65 328H705" stroke="url(#fadeLine)" stroke-width="2"/>
  <text x="65" y="356" fill="#a3bbd1" font-size="15">Building intelligent, secure systems from Uganda to the world.</text>
  <text x="65" y="386" fill="#e1b673" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="1.7">DESIGN  →  BUILD  →  VERIFY  →  SHIP<tspan class="cursor"> ▌</tspan></text>
 </g>
