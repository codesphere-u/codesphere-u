<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Codesphere Engineering Portfolio — Software Engineer, AI Systems Builder, Cybersecurity &amp; Cloud Architect</title>
  <desc id="bannerDesc">Technical banner showcasing AI Agent Security, Local AI Systems, Defensive Cybersecurity, Double-Entry Fintech Ledgers, and Distributed Observability.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d18" />
      <stop offset="50%" stop-color="#0b192c" />
      <stop offset="100%" stop-color="#071f24" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4de8ae" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55" />
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)" />
  <rect width="1200" height="340" rx="18" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#1e3a5f" stroke-width="2" />

  <!-- Top status pill -->
  <rect x="56" y="42" width="430" height="30" rx="15" fill="#0f2937" stroke="#2dd4bf" stroke-width="1" />
  <circle cx="76" cy="57" r="5" fill="#4de8ae" />
  <text x="92" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" fill="#99f6e4" letter-spacing="1.4">
    KAMPALA, UGANDA · GLOBAL SYSTEMS ENGINEERING
  </text>

  <!-- Main Headline -->
  <text x="56" y="128" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    Building Auditable AI, Defensive Security
  </text>
  <text x="56" y="180" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#accent)" letter-spacing="-1">
    &amp; High-Integrity Distributed Systems.
  </text>

  <!-- Positioning Subtitle -->
  <text x="56" y="226" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94a3b8">
    Software Engineer  |  AI Systems Builder  |  Cybersecurity  |  Full-Stack &amp; Cloud Engineering
  </text>

  <!-- Domain Pillar Pills -->
  <g transform="translate(56, 256)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="185" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="16" y="23" fill="#4de8ae">◈ AgentShield (OWASP)</text>

    <rect x="197" y="0" width="175" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="213" y="23" fill="#38bdf8">◈ Cyber Dragon v1.0</text>

    <rect x="384" y="0" width="175" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="400" y="23" fill="#a78bfa">◈ Auralis Local AI</text>

    <rect x="571" y="0" width="165" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="587" y="23" fill="#fbbf24">◈ FlowLedger Core</text>

    <rect x="748" y="0" width="155" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="764" y="23" fill="#f472b6">◈ ARGUS-AI v2.1</text>

    <rect x="915" y="0" width="170" height="36" rx="8" fill="#0f172a" stroke="#334155" />
    <text x="931" y="23" fill="#60a5fa">◈ StackPulse SRE</text>
  </g>
</svg>
