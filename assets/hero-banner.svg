<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-description">
<title id="hero-title">Akandwanaho Ivan Alvin — engineering beyond borders</title>
<desc id="hero-description">Animated dark-blue and gold engineering portfolio banner. Software engineer, AI systems builder, cybersecurity and full-stack engineering from Kampala, Uganda.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b16"/><stop offset=".6" stop-color="#0b1730"/><stop offset="1" stop-color="#071322"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#7bd7ff"/><stop offset=".57" stop-color="#64a6ff"/><stop offset="1" stop-color="#e9b76b"/></linearGradient>
 <linearGradient id="fadeLine"><stop stop-color="#64c8ff" stop-opacity=".9"/><stop offset="1" stop-color="#e4ad63" stop-opacity="0"/></linearGradient>
 <radialGradient id="haze"><stop stop-color="#2563eb" stop-opacity=".23"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#9fc5f0" stroke-opacity=".07"/></pattern>
 <clipPath id="frame"><rect width="1200" height="420" rx="18"/></clipPath>
</defs>
<style>
  .appear{animation:enter .9s both cubic-bezier(.2,.8,.2,1)}
  .delay1{animation-delay:.12s}.delay2{animation-delay:.28s}.delay3{animation-delay:.44s}
  .orbit{transform-origin:978px 208px;animation:spin 42s linear infinite}
  .orbitReverse{transform-origin:978px 208px;animation:spin 58s linear infinite reverse}
  .breath{animation:breath 5s ease-in-out infinite}
  .cursor{animation:blink 1.2s steps(1) infinite}
  .sweep{animation:sweep 7s ease-in-out infinite}
  .dash{stroke-dasharray:8 12;animation:dashes 18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breath{50%{opacity:.4;transform:scale(.975)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes sweep{0%,20%{transform:translateX(-240px);opacity:0}47%{opacity:.35}80%,100%{transform:translateX(1200px);opacity:0}}
  @keyframes dashes{to{stroke-dashoffset:-500}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
<g clip-path="url(#frame)">
 <rect width="1200" height="420" fill="url(#bg)"/>
